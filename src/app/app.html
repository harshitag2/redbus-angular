<!-- src/app/app.html -->
<!-- Root application shell: header, sticky search, router outlet for pages, footer -->

<style>
  :host { display: block; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; color: #222; }
  .page { min-height: 100vh; display: flex; flex-direction: column; }
  header, footer { width: 100%; }
  main { flex: 1; width: 100%; background: #fff; }
  .app-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; box-sizing: border-box; }
  .page-body { padding-top: 16px; }
</style>

<div class="page">
  <!-- Top header -->
  <app-header></app-header>

  <!-- SCROLL PROGRESS BAR (top thin indicator) -->
  <app-scroll-progress></app-scroll-progress>

  <!-- Sticky search (below header) -->
  <app-sticky-search></app-sticky-search>

  <!-- Main routed content -->
  <main class="page-body">
    <div class="app-container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <app-footer></app-footer>

  <!-- Back-to-top floating button -->
  <app-back-to-top></app-back-to-top>
</div>
